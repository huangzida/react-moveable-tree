name: Publish Package to npmjs

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG" != "$PKG_VERSION" ] && [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "Tag $TAG does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Verify tag commit is on main branch
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag commit $GITHUB_SHA is not contained in origin/main"
            exit 1
          fi

      - name: Verify manual dispatch runs on main branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF#refs/heads/}" != "main" ]; then
            echo "Manual publish is only allowed on main"
            exit 1
          fi

      - name: Type check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Simulate publish payload
        run: npm publish --dry-run --access public

      - name: Publish to npmjs with provenance (public repo)
        if: github.event.repository.private == false
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npmjs (private repo fallback)
        if: github.event.repository.private == true
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}